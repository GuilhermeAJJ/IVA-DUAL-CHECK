name: Tarefa
description: Uma entrega do roteiro, do tamanho de um PR.
assignees: ["GuilhermeAJJ"]
projects: ["GuilhermeAJJ/1"]
body:
  - type: markdown
    attributes:
      value: |
        Uma tarefa = uma issue = uma branch = um PR. Se não couber num PR, quebre em mais de uma.
        Os pontos vão no campo **Pontos** do quadro, não aqui.
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Por que a tarefa existe e o que ela destrava.
    validations:
      required: true
  - type: textarea
    id: escopo
    attributes:
      label: Escopo
      description: O que entra, em itens.
      placeholder: |
        - ...
    validations:
      required: true
  - type: textarea
    id: fora-do-escopo
    attributes:
      label: Fora do escopo
      description: O que fica para outra tarefa, e para qual.
  - type: textarea
    id: criterios-de-aceite
    attributes:
      label: Critérios de aceite
      description: Como saber que a tarefa está pronta. Cada item precisa ser verificável.
      value: |
        - [ ] ...
        - [ ] CHANGELOG atualizado
    validations:
      required: true
