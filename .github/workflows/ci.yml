name: CI

on:
  pull_request:
  push:
    branches: [main]

# Menor privilégio: o token do workflow só lê o repositório.
permissions:
  contents: read

# Um push novo no PR cancela a execução anterior do mesmo PR; na main, cada commit tem a sua.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint-e-testes:
    name: Lint e testes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # A mesma versão da máquina local. Atualize as duas juntas.
          version: "0.13.0"

      - name: Instala as dependências do uv.lock
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github

      - name: Ruff (formatação)
        run: uv run ruff format --check

      - name: pytest
        run: uv run pytest

  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Histórico inteiro, não só o último commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Instala o gitleaks, conferindo o SHA-256
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      # O log do Actions é público: com --redact, o achado aparece sem o valor do segredo.
      - name: Varre o histórico inteiro
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner .

  ambiente-local:
    name: Ambiente local (compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sobe os três serviços e espera ficarem saudáveis
        run: |
          cp .env.example .env
          docker compose up --build --wait --wait-timeout 180

      - name: Confere o /health pela porta publicada
        run: curl --fail --silent --show-error http://127.0.0.1:8000/health

      - name: Confere que a API não roda como root
        run: test "$(docker compose exec -T api id -u)" != "0"

      - name: Mostra os logs, se algo falhou
        if: failure()
        run: docker compose logs
