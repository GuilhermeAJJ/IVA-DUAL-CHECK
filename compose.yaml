name: iva-dual-check

# Ambiente local. As portas só abrem em 127.0.0.1: nenhuma fica acessível de outra máquina da rede.
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    # Menor privilégio: disco só de leitura, nenhuma capability do Linux e nenhuma escalada de privilégio.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina no .env (copie o .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env (copie o .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?defina no .env (copie o .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # A partir do PostgreSQL 18, a imagem guarda os dados em /var/lib/postgresql/18/docker; o volume vai na pasta de cima.
      - db-data:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1 testa pela rede: durante a criação do banco, o servidor provisório só escuta no socket local.
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  storage:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    # Só o Blob Storage, sem a coleta de telemetria que o Azurite liga por padrão.
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--location", "/data", "--disableTelemetry"]
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
  storage-data:
