[project]
name = "iva-dual-check"
version = "0.1.0.dev0"
description = "Conferência fiscal de notas de compra na reforma tributária (CBS e IBS), com IA só onde o código não resolve."
readme = "README.md"
authors = [
    { name = "Guilherme Justino" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]