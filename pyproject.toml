[project]
name = "iva-dual-check"
version = "0.1.0"
description = "Motor fiscal das notas de mercadoria (NF-e) nas 27 UFs: calcula os tributos da nota de venda e confere os da nota de compra, do ICMS e do IPI à CBS e ao IBS. O código calcula, um agente de IA investiga as divergências em segundo plano, e o analista decide."
readme = "README.md"
authors = [
    { name = "Guilherme Justino" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "S", "ASYNC", "FAST"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
